# Requires a Secret named "r2wai-secrets" in this namespace (NOT defined in this repo — create it
# per-environment via your cluster's real secret manager) with these keys:
#   ConnectionStrings__DefaultConnection   Full Npgsql connection string. Point this at a managed
#                                           Postgres instance (RDS/Cloud SQL/Azure Database) — this
#                                           repo deliberately does not ship a Postgres manifest;
#                                           running your primary datastore as an unmanaged in-cluster
#                                           pod is not a production-appropriate default.
#   Authentication__Jwt__SecretKey         >= 32 random bytes, base64 or plain — see JwtService.
#   Security__EncryptionKey                32-byte key, base64-encoded (AES-256) — see IEncryptionService.
#   Authentication__ApiKeys__0__Key        A real, rotatable API key for the seeded default key row.
#   AI__OpenAI__ApiKey                      Provider key for the default OpenAI configuration. For
#                                           local models, edit r2wai-config to a reachable endpoint.
#   Cache__Redis__ConnectionString           Authenticated Redis connection, e.g. redis:6379,password=...
#   REDIS_PASSWORD                          Same Redis password for the in-cluster Redis server.
#   Bootstrap__AdminEmail / Bootstrap__AdminPassword   (first start only, optional) The initial
#                                           administrator, created ONLY on an empty database (>= 12
#                                           character password). Demo accounts with public passwords
#                                           are never created here (Database__SeedDemoData is unset);
#                                           remove the password from the Secret after the first start.
# Example (fill in real values, never commit them):
#   kubectl create secret generic r2wai-secrets -n r2wai \
#     --from-literal=ConnectionStrings__DefaultConnection='Host=...;Database=r2wai;Username=...;Password=...' \
#     --from-literal=Authentication__Jwt__SecretKey='...' \
#     --from-literal=Security__EncryptionKey='...' \
#     --from-literal=AI__OpenAI__ApiKey='...' \
#     --from-literal=Cache__Redis__ConnectionString='redis:6379,password=...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=Authentication__ApiKeys__0__Key='...'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2wai-api
  namespace: r2wai
  labels:
    app: r2wai
    component: api
spec:
  # Keep one API replica until a multi-pod SignalR backplane, shared object storage, review of
  # remaining in-memory coordination, and production load measurements are complete. Schedule,
  # delay-resume, and escalation work now use database claims/locks; that alone does not make the
  # whole API horizontally scalable.
  replicas: 1
  selector:
    matchLabels:
      component: api
  template:
    metadata:
      labels:
        app: r2wai
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO-api:latest # kustomize edit set image before applying — see cd.yml
          # docker/Dockerfile.api already creates and switches to a non-root "appuser" (RUN
          # groupadd/useradd + USER appuser) — runAsNonRoot here just enforces what the image
          # already does by default, not a new constraint on it. Uploaded files use a persistent
          # volume while this deployment is single-replica; move to shared S3-compatible storage
          # before increasing replicas. Logs and document-processing temp files remain pod-local.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: r2wai-config
            - secretRef:
                name: r2wai-secrets
          volumeMounts:
            - name: api-storage
              mountPath: /app/App_Data/Storage
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: api-storage
---
apiVersion: v1
kind: Service
metadata:
  name: r2wai-api
  namespace: r2wai
  labels:
    app: r2wai
    component: api
spec:
  selector:
    component: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: r2wai-api
  namespace: r2wai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: r2wai-api
  # Pinned to 1 — see the note on `replicas` above. Raise after shared-state and load-readiness work.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-storage
  namespace: r2wai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
