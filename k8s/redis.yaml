# In-cluster Redis for rate-limiting/login-lockout/AiUsage-cap state shared across API replicas.
# Single replica is acceptable here — this is cache/counter state (RedisCacheService/
# RateLimitingMiddleware both degrade gracefully to a stricter-than-needed default on connect
# failure), not a source of truth. For a larger deployment, prefer a managed Redis
# (ElastiCache/Azure Cache/Memorystore) and point Cache__Redis__ConnectionString at it instead of
# this Service. r2wai-secrets must contain REDIS_PASSWORD; API pods also read the authenticated
# connection from Cache__Redis__ConnectionString in that Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: r2wai
  labels:
    app: r2wai
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: redis
  template:
    metadata:
      labels:
        app: r2wai
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r2wai-secrets
                  key: REDIS_PASSWORD
          # No runAsNonRoot/readOnlyRootFilesystem here: the upstream redis:7-alpine image runs as
          # root by default with no built-in non-root user (verified — `docker run --rm
          # redis:7-alpine id` returns uid=0, and /etc/passwd has no "redis" entry to switch to),
          # so forcing either without also rebuilding this image would be a real, unverified risk
          # to a component every API replica depends on for rate-limiting/lockout/usage-cap state.
          # allowPrivilegeEscalation/capabilities are safe regardless — redis-server never needs
          # elevated privileges to bind an unprivileged port or write its own data directory.
          #
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: r2wai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: r2wai
  labels:
    app: r2wai
    component: redis
spec:
  selector:
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
