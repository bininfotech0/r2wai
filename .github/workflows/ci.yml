name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0'

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore R2WAI.slnx

      - name: Build
        run: dotnet build R2WAI.slnx -c Release --no-restore

      # R2WAI.slnx (root) includes R2WAI.Api.Tests — previously only src/R2WAI.slnx ran here, which
      # silently excluded it, so the auth/authorization/security/Postgres-integration suite never ran
      # in CI. Testcontainers-based Postgres tests work as-is (Docker is available on GH-hosted
      # runners). Its old UI/ (Playwright, Blazor-era) subset is gone as of Phase 14 — superseded by
      # the `e2e` job below against src/R2WAI.Client/e2e.
      - name: Test with coverage
        run: dotnet test R2WAI.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          retention-days: 14

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/R2WAI.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/R2WAI.Client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # src/R2WAI.Widget is a fully separate package (no shared deps with
      # the SPA above) — type-check and build it here too, rather than only
      # exercising it indirectly via the Dockerfile.client build in the
      # `docker` job below.
      - name: Install widget dependencies
        working-directory: src/R2WAI.Widget
        run: npm ci

      - name: Build widget
        working-directory: src/R2WAI.Widget
        run: npm run build

  e2e:
    name: End-to-End (Gateway)
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      # Throwaway CI-only values — never used outside this ephemeral stack.
      DB_PASSWORD: ci_e2e_pg_${{ github.run_id }}
      JWT_SECRET: ci_e2e_jwt_secret_key_at_least_32_chars_long_${{ github.run_id }}
      ENCRYPTION_KEY: MTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWY=
      API_KEY_0: ci_e2e_api_key_${{ github.run_id }}
      # widget.spec.ts embeds the widget on a bare page served from this
      # origin to prove real cross-origin embedding — see docker-compose.yml.
      WIDGET_TEST_ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if docker exec r2wai-api curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            sleep 3
          done
          echo "::error::API did not become healthy in time"
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/R2WAI.Client/package-lock.json

      - name: Install client dependencies
        working-directory: src/R2WAI.Client
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: src/R2WAI.Client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite against the gateway
        working-directory: src/R2WAI.Client
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/R2WAI.Client/playwright-report/
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore R2WAI.slnx

      # R2WAI.slnx (root), not src/R2WAI.slnx — the same fix already applied to the backend job
      # above (see its own comment): the narrower src/R2WAI.slnx silently excludes
      # tests/R2WAI.Api.Tests, so this scan never checked that project's own package dependencies
      # for known vulnerabilities.
      - name: Check for vulnerable packages
        run: dotnet list R2WAI.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

      - name: Fail on critical vulnerabilities
        run: |
          if grep -qi "Critical" vulnerability-report.txt; then
            echo "::error::Critical vulnerabilities found in dependencies"
            exit 1
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: vulnerability-report.txt
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t r2wai-api:ci .

      - name: Build Studio (React) image
        run: docker build -f docker/Dockerfile.client -t r2wai-studio:ci .

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: r2wai-api:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Scan Studio image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: r2wai-studio:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # The two scans above never fail the build (exit-code: 0) — they only produce the visibility
      # report. Mirrors the NuGet check above (fails on "Critical" only, not High): a Critical CVE in
      # a shipped image is a real release blocker, not something to note and move past.
      - name: Fail on critical image vulnerabilities (API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: r2wai-api:ci
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Fail on critical image vulnerabilities (Studio)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: r2wai-studio:ci
          format: table
          exit-code: 1
          severity: CRITICAL
