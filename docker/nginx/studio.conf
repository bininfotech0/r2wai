# R2WAI Studio gateway config.
#
# Phase 14: gateway is 100% React — every route below is either /api/*,
# /hubs/*, a static asset, or an explicit SPA cut-over block, and the
# catch-all at the bottom now serves the SPA shell (for client-side routing
# and unknown paths) instead of proxying to Blazor. r2wai-web is gone from
# the stack; this file keeps its per-phase location blocks as a record of
# the strangler-fig migration rather than collapsing them into one rule.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Without this, a script served with no charset falls back to the
    # embedding page's own encoding — found via a real failure where the
    # widget (src/R2WAI.Widget, embedded on arbitrary third-party pages with
    # unpredictable charsets) had its UTF-8 "…" in widget.js misdecoded as
    # Windows-1252 ("Type a messageâ€¦") on a plain-HTML host page with no
    # charset of its own. Declaring it here makes /widget/widget.js's
    # encoding authoritative regardless of the host page.
    charset utf-8;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Distinct from the static /health above (kept as-is — it's the
    # container healthcheck's fast static probe). This proxies to the real
    # ASP.NET Core health-check report (Program.cs's app.MapHealthChecks
    # ("/health", ...)) for the About page's System Health panel.
    location = /api-health {
        proxy_pass http://r2wai-api:8080/health;
        proxy_set_header Host $host;
    }

    # API — always r2wai-api, regardless of cutover state. Read timeout and
    # buffering-off match the backend's own 5-minute AI-streaming budget (see
    # AuthenticatedHttpClient's matching client-side timeout) — nginx's 60s
    # default was cutting off long SSE chat streams (POST .../chat/stream)
    # and any other slow AI-backed call under /api/, and buffering would
    # delay/batch SSE frames instead of forwarding them as they're written.
    location /api/ {
        proxy_pass http://r2wai-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # SignalR hubs — always r2wai-api, WebSocket upgrade required.
    location /hubs/ {
        proxy_pass http://r2wai-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # React's own hashed build assets — needed regardless of which cut-over
    # route loaded the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    # Phase 10: the embeddable widget's IIFE bundle (src/R2WAI.Widget), built
    # and copied in separately from the SPA (see Dockerfile.client) — served
    # as a plain static file, not routed to index.html or Blazor. Must come
    # before the catch-all "/" proxy below or it would fall through to it.
    location /widget/ {
        try_files $uri =404;
    }

    # --- Cut-over paths ---
    # Trailing-slash variant matched alongside the exact path so e.g.
    # "/departments/" doesn't fall through to the Blazor catch-all below.
    # Phase 3: "/" and "/login".
    location = / {
        try_files /index.html =404;
    }
    location = /login {
        try_files /index.html =404;
    }
    # Phase 14: found never cut over in any earlier phase — silently served
    # by Blazor's own ForgotPassword.razor/ResetPassword.razor through the
    # catch-all below despite React's AuthLayout having had real pages for
    # both since Phase 1. Fixed as part of getting the gateway to 100% React
    # before Blazor can be decommissioned.
    location = /forgot-password {
        try_files /index.html =404;
    }
    location = /reset-password {
        try_files /index.html =404;
    }
    # Phase 4: Departments (CRUD pattern library proof).
    location ~ ^/departments/?$ {
        try_files /index.html =404;
    }
    # Phase 6: Assistant Studio (library, editor, playground).
    location ~ ^/assistants(/.*)?/?$ {
        try_files /index.html =404;
    }
    location ~ ^/playground/?$ {
        try_files /index.html =404;
    }
    # Phase 7: Automation/Workflow Studio (list, step-list detail; /builder
    # placeholder until Phase 8's Advanced Automation Builder lands).
    location ~ ^/automations(/.*)?/?$ {
        try_files /index.html =404;
    }
    # Phase 9: Knowledge & Integrations.
    location ~ ^/knowledge(/.*)?/?$ {
        try_files /index.html =404;
    }
    location ~ ^/integrations/?$ {
        try_files /index.html =404;
    }
    # Phase 10: Chatbots and Applications.
    location ~ ^/chatbots(/.*)?/?$ {
        try_files /index.html =404;
    }
    location ~ ^/applications(/.*)?/?$ {
        try_files /index.html =404;
    }
    # Phase 11: Operate (Runs, Approvals, Monitor).
    location ~ ^/runs/?$ {
        try_files /index.html =404;
    }
    location ~ ^/approvals/?$ {
        try_files /index.html =404;
    }
    location ~ ^/monitor/?$ {
        try_files /index.html =404;
    }
    # Phase 12: Manage (Users/Roles, AI Models, Security & Policies,
    # Settings, Tools & APIs).
    location ~ ^/users/?$ {
        try_files /index.html =404;
    }
    location ~ ^/models/?$ {
        try_files /index.html =404;
    }
    location ~ ^/security/?$ {
        try_files /index.html =404;
    }
    location ~ ^/settings/?$ {
        try_files /index.html =404;
    }
    location ~ ^/tools(/.*)?/?$ {
        try_files /index.html =404;
    }
    # Phase 13: remaining pages (Profile, Inbox, About).
    location ~ ^/profile/?$ {
        try_files /index.html =404;
    }
    location ~ ^/inbox/?$ {
        try_files /index.html =404;
    }
    location ~ ^/about/?$ {
        try_files /index.html =404;
    }

    # --- Catch-all: SPA shell (client-side router owns real 404s) ---
    location / {
        try_files /index.html =404;
    }
}
