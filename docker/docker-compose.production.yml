services:
  # Single public ingress — see docker/nginx/studio.conf.
  r2wai-studio:
    container_name: r2wai-studio
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "8080:8080"
    depends_on:
      r2wai-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - r2wai-network
    deploy:
      resources:
        limits:
          memory: 512M

  r2wai-api:
    container_name: r2wai-api
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # First-run administrator. On an EMPTY database the API creates the default tenant, roles and
      # built-in tools plus this one admin (email + password of >= 12 characters). No demo accounts are
      # ever created here. Remove BOOTSTRAP_ADMIN_PASSWORD from the environment after the first start.
      - Bootstrap__AdminEmail=${BOOTSTRAP_ADMIN_EMAIL:-}
      - Bootstrap__AdminPassword=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=r2wai;Username=r2wai;Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Cache__Redis__ConnectionString=redis:6379
      # Traces/metrics/logs export to console when unset (default). Bring up
      # docker-compose.monitoring.yml and set OTLP_ENDPOINT=http://jaeger:4317
      # to route real distributed traces to Jaeger instead.
      - OpenTelemetry__OtlpEndpoint=${OTLP_ENDPOINT:-}
      - Authentication__Jwt__SecretKey=${JWT_SECRET}
      - Authentication__Jwt__ExpirationMinutes=15
      - Authentication__Jwt__RefreshTokenExpirationDays=7
      # Online path (default): OpenAI. Offline path: set AI_PROVIDER=ollama and point OLLAMA_ENDPOINT
      # at a real, properly-resourced Ollama host — this compose file deliberately does not bundle an
      # Ollama container (unlike docker-compose.yml's dev convenience default): CPU-only inference is
      # not viable for tool-enabled chat under real load, so a production Ollama deployment needs its
      # own GPU-backed host, not a container sharing this box's resources. Both paths are genuinely
      # usable side by side per-assistant via each ModelConfiguration's own provider (AI Models page) —
      # this env var only sets the platform-wide fallback used when a ModelConfiguration doesn't
      # override it.
      - AI__Provider=${AI_PROVIDER:-openai}
      - AI__OpenAI__ApiKey=${OPENAI_API_KEY}
      - AI__Ollama__Endpoint=${OLLAMA_ENDPOINT:-}
      - AI__Ollama__ModelId=${OLLAMA_MODEL:-}
      - AI__Ollama__EmbeddingModel=${OLLAMA_EMBEDDING_MODEL:-}
      - Storage__Provider=local
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - Email__SmtpHost=${SMTP_HOST:-}
      - Email__SmtpPort=${SMTP_PORT:-587}
      - Email__SmtpUser=${SMTP_USER:-}
      - Email__SmtpPassword=${SMTP_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM:-noreply@r2wai.com}
      - Email__EnableSsl=true
      - CORS__AllowedOrigins__0=${CORS_ORIGIN_0:-http://localhost:8080}
      - CORS__AllowedOrigins__1=${CORS_ORIGIN_1:-}
      - CORS__AllowedOrigins__2=${CORS_ORIGIN_2:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - r2wai-network
    volumes:
      - api-storage:/app/App_Data/Storage
      - api-logs:/app/Logs
    deploy:
      resources:
        limits:
          memory: 1G

  # Shares rate-limiting, login-lockout, and AiUsage-cap state across API replicas — see
  # docker-compose.yml's identical service for the full rationale.
  redis:
    container_name: r2wai-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - r2wai-network
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    container_name: r2wai-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: r2wai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: r2wai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2wai -d r2wai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - r2wai-network
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres-data:
  redis-data:
  api-storage:
  api-logs:

networks:
  r2wai-network:
    driver: bridge
